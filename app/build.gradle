plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseSigningVariables = [
    'PIXLOAD_RELEASE_KEYSTORE', 'PIXLOAD_RELEASE_STORE_PASSWORD',
    'PIXLOAD_RELEASE_KEY_ALIAS', 'PIXLOAD_RELEASE_KEY_PASSWORD'
]
def releaseSigningReady = releaseSigningVariables.every { System.getenv(it) }
if (gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } && !releaseSigningReady) {
    throw new GradleException('Para compilar la versión release configura PIXLOAD_RELEASE_KEYSTORE, PIXLOAD_RELEASE_STORE_PASSWORD, PIXLOAD_RELEASE_KEY_ALIAS y PIXLOAD_RELEASE_KEY_PASSWORD.')
}

android {
    namespace 'com.pixload.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pixload.app'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv('PIXLOAD_RELEASE_KEYSTORE'))
                storePassword System.getenv('PIXLOAD_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('PIXLOAD_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('PIXLOAD_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation project(':shared')
    implementation 'org.jcodec:jcodec-android:0.2.5'
    implementation 'com.squareup:gifencoder:0.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
